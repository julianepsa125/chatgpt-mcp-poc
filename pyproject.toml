[project]
name = "chatgpt-mcp-poc"
version = "0.1.0"
description = "Minimal remote MCP server PoC for testing with ChatGPT custom MCP apps"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "anyio>=4,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
